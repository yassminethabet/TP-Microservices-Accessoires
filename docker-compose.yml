services:
  backend:
    build: ./backend-accessoires
    container_name: backend-accessoires
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "1337"
      DATABASE_CLIENT: "sqlite"
      DATABASE_FILENAME: ".tmp/data.db"
      APP_KEYS: "devKey1,devKey2,devKey3,devKey4"
      API_TOKEN_SALT: "dev-api-token-salt-change-me"
      ADMIN_JWT_SECRET: "dev-admin-jwt-secret-change-me"
      TRANSFER_TOKEN_SALT: "dev-transfer-token-salt-change-me"
      JWT_SECRET: "dev-jwt-secret-change-me"
    ports:
      - "1337:1337"
    volumes:
      - ./backend-accessoires/.tmp:/opt/app/.tmp
      - ./backend-accessoires/public/uploads:/opt/app/public/uploads
    networks:
      - accessoires-network

  frontend:
    build: ./frontend-vitrine
    container_name: frontend-vitrine
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:1337"
      STRAPI_URL: "http://backend:1337"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - accessoires-network

networks:
  accessoires-network:
    driver: bridge